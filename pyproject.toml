[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.coverage.run]
source = [
    "scripts",
    "mirror_system",
    "source_system",
    "conversation",
    "integrations",
]
omit = [
    # This is now the real PracticeWorks connector (queries confirmed
    # against the live TUTOR database), but it still can't be imported
    # here -- pyodbc needs a native ODBC driver manager (unixODBC/iODBC)
    # that only exists on the actual PracticeWorks-connected Windows
    # machine, not this dev environment. Its logic is covered indirectly
    # via test_sync_from_pervasive.py, which fakes this module's
    # functions rather than importing the real (pyodbc-dependent) file.
    "*/pervasive_odbc_source.py",
    # Manual verification scripts -- run for real on the Windows machine
    # (see their own docstrings), need a live ODBC connection to mean
    # anything, nothing here to unit-test in isolation.
    "*/demo_tutor.py",
    "*/demo_tutor_write_test.py",
    "*/demo_tutor_new_booking_test.py",
]

[tool.coverage.report]
exclude_lines = [
    # Setting this option replaces coverage.py's built-in default list
    # rather than adding to it -- "pragma: no cover" has to be re-listed
    # explicitly or it silently stops working.
    "pragma: no cover",
    "if __name__ == .__main__.:",
]
